name: CI

# Triggered on every PR (any target) and on every push to main/master so
# direct commits are gated too. Required status checks (Settings → Branches →
# Branch protection rules) make CI failures block merge.

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

# Cancel superseded runs on the same ref — keeps PR feedback fast and saves
# CI minutes when a PR is force-pushed repeatedly.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type check & tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # PINNED: a floating "latest" silently drifted the release runtime
          # away from local dev (v4.5.2 exe = Bun 1.4.0 keep-alive timer
          # semantics local 1.3.14 never exercised — see AGENTS.md #37).
          # Bump deliberately, together with local dev environments.
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test:offline

  android:
    name: Android tests, lint & APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_BUILD_MODE: local
      ORG_GRADLE_PROJECT_androidApp_versionCode: "1"
      ORG_GRADLE_PROJECT_androidApp_versionName: ci-android
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "::error::ANDROID_HOME or ANDROID_SDK_ROOT is not set on this runner."
            exit 1
          fi
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT/cmdline-tools."
            exit 1
          fi
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test, lint and build APKs
        run: bun run build:android-apk :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease
      - name: Android control lifecycle smoke test
        run: python3 scripts/android-smoke.py
